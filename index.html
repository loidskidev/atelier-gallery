<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header></header>

    <!-- Main -->
    <!-- Container-->
    <main class="container">
      <div class="card">
        <figure class="card-1">
          <!--Modern Art Section Card -->
          <img
            src="https://images.pexels.com/photos/9120650/pexels-photo-9120650.jpeg"
            alt="A picture of modern art"
          />
          <figcaption>Modern Art</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-2">
          <!-- Sculpture Section Card -->
          <img
            src="https://images.pexels.com/photos/12098660/pexels-photo-12098660.jpeg"
            alt="A picture showing 2 Sculptures, facing each other"
          />
          <figcaption>Sculptures</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-3">
          <!-- Photography Section Card -->
          <img
            src="https://images.pexels.com/photos/20337611/pexels-photo-20337611.jpeg"
            alt="A picture of Mars in a photographic style"
          />
          <figcaption>Photography</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-4">
          <!-- Abstract Section Card -->
          <img
            src="https://images.pexels.com/photos/30903758/pexels-photo-30903758.jpeg"
            alt="A colorful abstract picture"
          />
          <figcaption>Abstract</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-5">
          <!-- Landscape Section Card -->
          <img
            src="https://images.pexels.com/photos/29749221/pexels-photo-29749221.jpeg"
            alt="Sunny Landscape"
          />
          <figcaption>Landscape</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-6">
          <!-- Portraits Section Card -->
          <img
            src="https://images.pexels.com/photos/5021754/pexels-photo-5021754.jpeg"
            alt="A portrait of a young person, facing to the right side of the picture"
          />
          <figcaption>Portraits</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-7">
          <!--Installations Section Card -->
          <img
            src="https://images.pexels.com/photos/8495982/pexels-photo-8495982.jpeg"
            alt="Random installed cages"
          />
          <figcaption>Installations</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-8">
          <!-- Digital Art Section Card -->
          <img
            src="https://images.pexels.com/photos/6252340/pexels-photo-6252340.jpeg"
            alt="Digital Art combined with various colors"
          />
          <figcaption>Digital Art</figcaption>
        </figure>
      </div>
      <!-- -->
      <div class="card">
        <figure class="card-9">
          <!-- Street Art Section Card -->
          <img
            src="https://images.pexels.com/photos/13837360/pexels-photo-13837360.jpeg"
            alt="Street Art, sprayed by a random artist"
          />
          <figcaption>Street Art</figcaption>
        </figure>
      </div>
    </main>
    <footer>
      <a href="https://www.codefactory.wien/kontakt">Contact</a>
    </footer>
  </body>
</html>
